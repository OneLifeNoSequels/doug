# Build Doug for Windows x64 and publish it as a GitHub release.
#
# Produces doug-<version>-windows-x64.msi (installer) and doug-<version>-windows-x64-portable.zip
# with packaging/windows/package.ps1, and attaches both to the release tagged v<version>
# (the version in the root Cargo.toml). Runs when a v* tag is pushed, or by hand from the
# Actions tab ("Run workflow"). Builds are unsigned: Windows SmartScreen will ask once before
# the installer runs ("More info" ▸ "Run anyway").
name: Build Doug for Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doug-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      DIST: ${{ github.workspace }}\dist\release
      # Japanese UI/title fonts, as in upstream FilmCraft releases (optional build input).
      CRAFT_FONTS_REF: abb83316d96aa59c1cf64784289e378fe9fa5695
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: doug-windows-x64

      - name: craft-fonts
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/storytold/craft-fonts "$env:RUNNER_TEMP\craft-fonts"
          git -C "$env:RUNNER_TEMP\craft-fonts" checkout $env:CRAFT_FONTS_REF
          "CRAFT_FONTS_DIR=$env:RUNNER_TEMP\craft-fonts" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: WiX v5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix --version

      - name: Build and package
        shell: pwsh
        run: pwsh packaging/windows/package.ps1 -Arch x64

      - uses: actions/upload-artifact@v4
        with:
          name: doug-windows-x64
          path: dist/release/*
          if-no-files-found: error

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $inPkg = $false; $version = $null
          foreach ($line in Get-Content Cargo.toml) {
            if ($line -match '^\s*\[') { $inPkg = ($line.Trim() -eq '[workspace.package]'); continue }
            if ($inPkg -and $line -match '^\s*version\s*=\s*"([^"]+)"') { $version = $Matches[1]; break }
          }
          $tag = "v$version"
          $files = Get-ChildItem dist/release -File | ForEach-Object { $_.FullName }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            $notes = "Doug $version for Windows x64 (a renamed build of FilmCraft, https://github.com/storytold/filmcraft).`n`n- **doug-$version-windows-x64.msi**: installer (Program Files\Doug, Start Menu shortcuts *Doug* and *Doug for Claude*).`n- **doug-$version-windows-x64-portable.zip**: no-install version.`n`nUnsigned build: Windows SmartScreen asks once before running the installer (More info > Run anyway)."
            gh release create $tag @files --target $env:GITHUB_SHA --title "Doug $version" --notes $notes
          }
